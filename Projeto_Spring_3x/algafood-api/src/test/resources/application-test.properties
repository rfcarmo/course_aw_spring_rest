spring.application.name=algafood-api

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/algafood?currentSchema=test
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.show-sql=true
spring.jpa.open-in-view=true
spring.jpa.default_schema=test
spring.jpa.properties.hobernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=test

spring.flyway.enabled=true
spring.flyway.schemas=test
spring.flyway.default-schema=test
spring.flyway.locations=classpath:db/migration,classpath:db/testdata

spring.datasource.hikari.schema=test
#spring.datasourc

logging.level.org.flywaydb=INFO