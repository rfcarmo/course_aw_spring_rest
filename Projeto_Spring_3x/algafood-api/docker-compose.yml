version: '3.8'

services:
  postgres18:
    image: postgres:18
    container_name: postgres18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: algafood
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - pg-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d algafood"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

networks:
  pg-network:
    driver: bridge